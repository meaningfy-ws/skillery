# Trigger-probe fixtures: repo data, not a model run. Each probe is a representative user phrase;
# `expect` is the skill that should fire, and `near_miss_of` (optional) the neighbour that must not.
# The validator checks deterministically that every `expect` names a real skill and that every skill
# has a probe. Behavioural trigger testing follows the agentskills.io method (about 20 queries, half
# near-misses, 3 runs each) with `skill-creator`, seeded from these probes; CI never runs a model.
# The on-demand `claude plugin eval` workflow (.github/workflows/plugin-eval.yml) runs bundle suites
# from tests/evals/ when a maintainer starts it.
probes:
  - probe: "help me price this ontology / knowledge-graph consulting engagement"
    expect: semantic-consulting-coach
  - probe: "produce the decision package: recommendation, scope, buy/build/defer, execution brief"
    expect: decision-package
  - probe: "write a fixed-cost proposal and SoW with an explicit scope boundary"
    expect: proposal-writing
  - probe: "PERT estimate this engagement with a work breakdown and contingency"
    expect: estimation
  - probe: "turn this rough input into a board-ready recommendation"
    expect: executive-communication
  - probe: "write the README and docstrings for this module"
    expect: technical-writing
  - probe: "this explainer reads flat, add a controlling metaphor and a concrete example, tighten the rhythm"
    expect: explanatory-writing
  - probe: "scaffold a new Meaningfy-standard Python repository"
    expect: project-setup
  - probe: "design the layered architecture (models/adapters/services) for this service"
    expect: cosmic-python
  - probe: "draw the C4 container diagram and write an ADR"
    expect: architecture
  - probe: "model the domain in LinkML and generate Pydantic + OWL + SHACL"
    expect: conceptual-modelling
  - probe: "set up the CD deploy workflow and push a versioned GHCR image"
    expect: ci-cd-delivery
  - probe: "cut a release, bump the version, and publish the library to PyPI"
    expect: meaningfy-release
  - probe: "what is the branch naming and commit-message convention"
    expect: meaningfy-git-workflow
  - probe: "shape this EPIC and derive its PLAN"
    expect: epic-planning
  - probe: "archive this change and merge the spec deltas into specs/"
    expect: spec-stewardship
  - probe: "bound this agent's decisions and defend against prompt injection"
    expect: guardrails
  # subagent-dispatch D-8: the dispatch rules live in guardrails.
  - probe: "should I spawn subagents for these four tasks, and what should each brief contain"
    expect: guardrails
  - probe: "review this diff before I open the PR"
    expect: meaningfy-code-review
    near_miss_of: guardrails
  - probe: "score this spec against the clarity gate before implementation"
    expect: clarity-gate
  - probe: "write Gherkin feature files for this acceptance criterion"
    expect: bdd-gherkin
  - probe: "review this change against the cosmic-python layers before the PR"
    expect: meaningfy-code-review
  - probe: "set up my Obsidian vault and connect it to Google Drive"
    expect: vault-setup
  - probe: "what properties does a meeting note in my vault need"
    expect: vault-conventions
  - probe: "create a project folder in my vault for the portal work"
    expect: vault-project
  - probe: "close the onboarding project in my vault and archive it"
    expect: vault-project
  - probe: "resume the onboarding portal project, where were we"
    expect: vault-resume
  - probe: "file these call notes into the onboarding portal project"
    expect: vault-capture
  - probe: "promote this proposed note from the vault inbox into resources"
    expect: vault-promote
  - probe: "tidy up my vault inbox and merge the duplicate notes"
    expect: vault-tidy
  - probe: "plan my week and set my quarterly OKRs in the vault"
    expect: vault-planning
  - probe: "write my morning daily note with calendar and mail"
    expect: vault-daily
  # Near-miss probes (fix-accumulated-skill-defects G1): `near_miss_of` names the neighbour that must
  # NOT fire for this phrase. Data only; the linter reads `expect`.
  - probe: "explain how the bundle generator works, for the repo docs"
    expect: technical-writing
    near_miss_of: explanatory-writing
  - probe: "why does this ADR read badly"
    expect: writing-antipatterns
    near_miss_of: executive-communication
  - probe: "tighten the cover email for this quotation"
    expect: executive-communication
    near_miss_of: proposal-writing
  - probe: "write the proposal and SoW for the Decision Phase"
    expect: proposal-writing
    near_miss_of: executive-communication
  - probe: "is this Odoo deal rotting, and may the sales agent move it to the next stage?"
    expect: sales-pipeline-custody
  - probe: "write the proposal for the workshop deal in our Odoo pipeline"
    expect: proposal-writing
    near_miss_of: sales-pipeline-custody
  - probe: "is this person already in our Odoo, and update her profile after today's call"
    expect: sales-accounts
  - probe: "file my notes from today's call with Anna into the project's session log in my vault"
    expect: vault-capture
    near_miss_of: sales-accounts
  - probe: "close the sales day and apply my answers in today's grooming note"
    expect: sales-operations
  - probe: "close the project and move its folder to the archive in my vault"
    expect: vault-project
    near_miss_of: sales-operations
  - probe: "score this deal on the five Ps and tell me who the economic buyer is"
    expect: sales-qualification
  - probe: "coach me on whether this prospect is ready for a decision phase or just exploring"
    expect: semantic-consulting-coach
    near_miss_of: sales-qualification
  - probe: "prepare my meeting with Acme tomorrow and draft the follow-up email after it"
    expect: sales-conversations
  - probe: "tighten the cover email for this quotation so it reads answer-first"
    expect: executive-communication
    near_miss_of: sales-conversations
  - probe: "move this proposed note into the project"
    expect: vault-promote
    near_miss_of: vault-tidy
  - probe: "reorganise the notes in my inbox"
    expect: vault-tidy
    near_miss_of: vault-promote
  - probe: "delete these two notes from my vault"
    expect: vault-conventions
    near_miss_of: vault-tidy
  - probe: "the copy says our method keeps data consistent, is that claim sound"
    expect: writing-antipatterns
    near_miss_of: executive-communication
  # estimation's description no longer delegates to epic-planning (define-catalogue-model §B).
  - probe: "give me a fixed-price estimate with contingency for this bid"
    expect: estimation
    near_miss_of: proposal-writing
  - probe: "break this feature into an EPIC with its tasks and acceptance criteria"
    expect: epic-planning
    near_miss_of: estimation
  # Batch D (restructure-and-evaluate-catalogue): the two skills that had no probe.
  - probe: "derive a LinkML schema from this UML model and generate Pydantic and SHACL from it"
    expect: linkml-engineering
    near_miss_of: conceptual-modelling
  - probe: "decide what concepts our domain has and how they relate, before we pick a modelling language"
    expect: conceptual-modelling
    near_miss_of: linkml-engineering
  - probe: "review this model for naming anti-patterns and attributes that should be reusable properties"
    expect: modelling-conventions
    near_miss_of: conceptual-modelling
  - probe: "draw the C4 container view and record the decision in an ADR"
    expect: architecture
    near_miss_of: modelling-conventions
  # meaningfy-voice: the foundation skill holding the company voice (restructure-and-evaluate D-15).
  - probe: "is this paragraph on-voice for Meaningfy, British English and no em dash"
    expect: meaningfy-voice
    near_miss_of: explanatory-writing
  - probe: "restructure this board memo answer-first with a governing thought"
    expect: executive-communication
    near_miss_of: meaningfy-voice
  # add-devops-bundle (task 5.4): one positive and one near-miss per devops skill.
  - probe: "resize the server and run the terraform plan before we apply it"
    expect: infrastructure-operations
  - probe: "scaffold a new Python service repo with CI and the spine"
    expect: project-setup
    near_miss_of: infrastructure-operations
  - probe: "deploy the new version of the stack and roll back if the healthcheck fails"
    expect: stack-operations
  - probe: "build and push a versioned GHCR image from the app repo"
    expect: ci-cd-delivery
    near_miss_of: stack-operations
  - probe: "an alert fired overnight, is everything ok with our services"
    expect: service-reliability
  - probe: "cut a release and write the release notes"
    expect: meaningfy-release
    near_miss_of: service-reliability
  - probe: "a colleague is leaving, offboard them and rotate the passwords they knew"
    expect: infrastructure-security
  - probe: "stop the agent from running destructive commands without asking"
    expect: guardrails
    near_miss_of: infrastructure-security
  # add-devops-bundle DEC-18: reporting a skill or agent problem to skillery.
  - probe: "the stack-operations skill gave a wrong command, report it to skillery"
    expect: skillery-feedback
  - probe: "open a PR with my fix and follow the branch naming convention"
    expect: meaningfy-git-workflow
    near_miss_of: skillery-feedback
  - probe: "from now on, never send anything to a client without my approval; remember that as a rule"
    expect: rule-learner
    near_miss_of: vault-capture
  - probe: "load my writing rules for this client memo and check the draft against them"
    expect: rulebook
    near_miss_of: executive-communication
  - probe: "which of my rules were overridden or never used this week? groom the rulebook"
    expect: rule-steward
    near_miss_of: formal-reasoning
