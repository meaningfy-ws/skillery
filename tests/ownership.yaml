# Single-owner capability map (Q5.2=B) — the machine-readable half of the
# methodology's ownership table. Each capability is OWNED by exactly one place;
# no other skill should re-specify it (RISK-4, no double-spec). The validator
# flags (NON-BLOCKING) when a non-owner skill's SKILL.md contains a defining
# claim pattern. `owner: external:<name>` means the owner is an external skill
# (superpowers/stream-coding/openspec), so ANY local skill claiming it is flagged.
# docs/practice/ai-coding/build-lifecycle.md §7 narrates this; this file is the tripwire.
capabilities:
  - tag: clarity-rubric
    owner: clarity-gate
    claim_patterns: ["6-criterion rubric", "13-item checklist"]
  - tag: gherkin-authoring
    owner: bdd-gherkin
    claim_patterns: ["Scenario Outline"]
  - tag: layer-architecture
    owner: cosmic-python
    claim_patterns: ["models/adapters/services/entrypoints"]
  - tag: branch-naming
    owner: meaningfy-git-workflow
    claim_patterns: ["<type>/<ticket-id>/<short-label>"]
  - tag: tdd-loop
    owner: "external:superpowers"
    claim_patterns: ["red.?green.?refactor"]
  - tag: code-principles-catalogue
    owner: cosmic-python
    # Guards against REGRESSION (re-narrowing the rule / restating prose), NOT id citation —
    # citing `AP-*`/`PR-*` ids is the desired behaviour. Flags the old models/services narrowing.
    claim_patterns: ["magic strings in models or services", "raw dicts.{0,20}in models or services"]
  - tag: vault-note-conventions
    owner: vault-conventions
    # Kinds and their required properties are defined once; other vault-* skills cite them.
    claim_patterns: ["required properties", "\\| kind \\|"]
  # add-sales-bundle (task 5.3): the sales skills and the facts they share with their neighbours.
  - tag: crm-write-policy
    owner: sales-pipeline-custody
    claim_patterns: ["tier by effect, not by tool", "default_tier"]
  - tag: five-p-score
    owner: sales-qualification
    claim_patterns: ["Pursue\\*\\* \\| 7–10", "Not now\\*\\* \\| 0–3"]
  - tag: decision-card
    owner: executive-communication
    claim_patterns: ["YES WRITES:", "at most \\*{0,2}150 words"]
  - tag: offer-ladder
    owner: semantic-consulting-coach
    claim_patterns: ["4–6 weeks, calendar-boxed", "1–2 day workshop"]
  - tag: run-note-shape
    owner: sales-operations
    claim_patterns: ["not yet, can continue", "15 deals in depth"]
  - tag: personal-details
    owner: sales-accounts
    claim_patterns: ["three rules for personal details"]
  # add-devops-bundle (task 5.5): the devops skills and the facts they own.
  - tag: safe-change-protocol
    owner: infrastructure-operations
    claim_patterns: ["apply exactly what was shown"]
  - tag: stack-standard
    owner: stack-operations
    claim_patterns: ["S1.{0,3}S9", "conformance-exception: S"]
  - tag: unattended-action-policy
    owner: service-reliability
    claim_patterns: ["park_if", "never_if", "attempts >= 2"]
  - tag: daily-checkup
    owner: service-reliability
    claim_patterns: ["scrape targets down", "disk forecast"]
  - tag: incident-severity
    owner: service-reliability
    claim_patterns: ["\\| \\*\\*critical\\*\\* \\|", "`info` opens no issue"]
  - tag: secret-handling
    owner: infrastructure-security
    claim_patterns: ["bw get", "used without being seen"]
  - tag: rule-model
    owner: rulebook
    claim_patterns: ["hard beats default beats soft"]
