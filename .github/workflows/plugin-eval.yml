# On-demand behavioural evals for one bundle (skill-crafting-method D-3, design H-7).
# Started by hand only (Actions → plugin-eval → Run workflow); never on push, pull request or release.
# Needs the repository secret ANTHROPIC_API_KEY, which a maintainer adds; without it the job stops at
# step 0. Suites live in evals/<bundle>/<case>/ (prompt.md + graders/), never under bundles/ (rendered).
name: plugin-eval

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: Bundle to evaluate
        required: true
        type: choice
        options: [meaningfy-core, meaningfy-consulting, meaningfy-architecture, meaningfy-building, vault-assistant]
      case:
        description: Case name glob
        default: "*"
      runs:
        description: Runs per case per arm
        default: "3"
      max_cost_usd:
        description: Ceiling on the run's list-price cost estimate (USD)
        default: "5"
      model:
        description: Model under test (pinned)
        default: claude-sonnet-5-5
      ablation:
        description: "none = one arm (half the cost); auto = add the no-plugin baseline"
        type: choice
        options: [none, auto]
        default: none

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BUNDLE: ${{ inputs.bundle }}
    steps:
      - name: "0. Check the secret"
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Set the ANTHROPIC_API_KEY repository secret to run plugin evals."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Check a suite exists
        run: |
          if [ ! -d "evals/$BUNDLE" ]; then
            echo "::error::No suite for $BUNDLE (expected evals/$BUNDLE/<case>/)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Assemble a temporary plugin
        run: |
          P="$RUNNER_TEMP/plugin"
          mkdir -p "$P/.claude-plugin"
          cp -rL "bundles/$BUNDLE/." "$P/"
          printf '{"name": "%s", "version": "%s"}\n' "$BUNDLE" "$(cat VERSION)" > "$RUNNER_TEMP/plugin/.claude-plugin/plugin.json"
          cp -r "evals/$BUNDLE" "$P/evals"
      - name: Run the evals
        env:
          CASE: ${{ inputs.case }}
          RUNS: ${{ inputs.runs }}
          MAX_COST: ${{ inputs.max_cost_usd }}
          MODEL: ${{ inputs.model }}
          ABLATION: ${{ inputs.ablation }}
        run: |
          claude plugin eval "$RUNNER_TEMP/plugin" --trust-plugin --no-publish \
            --case "$CASE" --runs "$RUNS" --max-cost-usd "$MAX_COST" --model "$MODEL" \
            --ablation "$ABLATION"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-eval-${{ inputs.bundle }}
          path: ${{ runner.temp }}/plugin/evals/results/
          if-no-files-found: warn
