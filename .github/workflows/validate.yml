name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # the formal-reasoning engine tests fail instead of skipping when an engine is absent
      REQUIRE_ENGINES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      # retry: the runner's apt mirror DNS failed for ~20 min on 2026-11-11 and turned every run red
      - name: Install SWI-Prolog
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=5 update &&
              sudo apt-get -o Acquire::Retries=5 install -y swi-prolog-nox && exit 0
            echo "apt attempt $attempt failed; retrying in 60s"; sleep 60
          done
          exit 1
      - run: python -m tools.repo_lint
      # bundles/ is generated and committed: regenerate it and prove nothing changed (never hand-edited).
      - run: python -m tools.bundle_gen generate
      - run: git diff --exit-code -- .claude-plugin tools/opencode-catalogue.json package.json bundles openspec/schemas
      - run: test -z "$(git status --porcelain -- bundles)"
      # tracked symlinks only under bundles/ (generated links into skills/ and agents/)
      - run: test -z "$(git ls-files -s | awk '$1 == 120000 && $4 !~ /^bundles\//')"
      - run: python -m tools.bundle_gen check
      - run: python -m pytest tests/ -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: make mods

  validate-spine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify OpenSpec version pin matches
        run: |
          v=$(cat openspec/openspec-version.txt)
          installed=$(npx --yes @fission-ai/openspec@"$v" --version)
          echo "pinned=$v installed=$installed"
          test "$v" = "$installed"
      - name: Validate the meaningfy schema + changes (structural gate)
        run: make validate-spine

  # The opencode installer (skillery-opencode) and its agent renderer. No `npm install`:
  # the package has no dependencies (single-source-distribution D6, D16).
  opencode-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run test:opencode-installer
