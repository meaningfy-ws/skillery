name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m tools.repo_lint
      # bundles/ is generated, not committed (rebundle-by-activity D-8): generate it, prove generation
      # changed no committed file, then check the links.
      - run: python -m tools.bundle_gen generate
      - run: git diff --exit-code -- .claude-plugin tools/opencode-catalogue.json package.json
      - run: python -m tools.bundle_gen check
      - run: python -m pytest tests/ -q

  validate-spine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify OpenSpec version pin matches
        run: |
          v=$(cat openspec/openspec-version.txt)
          installed=$(npx --yes @fission-ai/openspec@"$v" --version)
          echo "pinned=$v installed=$installed"
          test "$v" = "$installed"
      - name: Validate the meaningfy schema + changes (structural gate)
        run: make validate-spine

  # The opencode installer (skillery-opencode) and its agent renderer. No `npm install`:
  # the package has no dependencies (single-source-distribution D6, D16).
  opencode-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run test:opencode-installer
