  used_by: project-setup routing, CLAUDE.md
  opencode_status: native (own opencode plugin)
  claude_install: plugin marketplace
  opencode_install: 'ships its own opencode plugin — `{"plugin": ["@dietrichgebert/ponytail"]}` in `opencode.json`;
    `/ponytail` slash form → opencode `ponytail` command (delegated).'
- name: stream-coding
  kind: skill
  summary: doc-first method
  source: repo skill (a single SKILL.md)
  pin: 'unpinned: installed from the source head'
  provenance: not reviewed
  used_by: clarity-gate, cosmic-python (external method)
  opencode_status: claude-compat
  claude_install: plugin / repo skill
  opencode_install: it's a single `SKILL.md`, not a package — copy it into `.claude/skills/stream-coding/`;
    opencode reads that path natively.
- name: commit-commands
  kind: plugin
  summary: '`commit-commands:commit`'
  source: claude-plugins-official
  pin: 'unpinned: installed from the source head'
  provenance: not reviewed
  used_by: meaningfy-git-workflow
  opencode_status: native (command)
  claude_install: plugin command
  opencode_install: opencode `.opencode/commands/`; the *content* derives from the shared command source,
    registration is per-CLI (tool-native boundary).
- name: OpenSpec
  kind: cli-tool
  summary: '`@fission-ai/openspec`, the spine engine + `/opsx:*`'
  source: npm @fission-ai/openspec
  pin: 'unpinned: installed from the source head'
  provenance: not reviewed
  used_by: the spine (project-setup, epic-planning, spec-stewardship)
  opencode_status: native
  claude_install: '`npm i -g @fission-ai/openspec`; `openspec update --tools claude`'
  opencode_install: same npm package; `openspec update --tools opencode` registers `opsx-<id>`. Registration
    form is tool-native (differs by design), not a gap.
- name: obsidian-skills
  kind: plugin
  summary: '`obsidian@obsidian-skills`: obsidian-markdown, obsidian-bases, obsidian-cli; MIT, [kepano/obsidian-skills](https://github.com/kepano/obsidian-skills)'
  source: kepano/obsidian-skills
  pin: 'unpinned: installed from the source head'
  provenance: MIT, not reviewed
  used_by: every `vault-*` skill (mandatory for `vault-assistant`)
  opencode_status: unverified (plain `SKILL.md` files)
  claude_install: '`/plugin marketplace add kepano/obsidian-skills` + `/plugin install obsidian@obsidian-skills`'
  opencode_install: 'clone into the user''s global opencode skills folder, never into a vault. Gaps for
    `vault-assistant` on opencode: explicit-only skills are invoked by name (no slash form); vault permission
    settings **UNVERIFIED** (see `skills/vault-setup/references/permissions-opencode.md`; a 2026-09-15
    test run was inconclusive because the opencode provider did not answer).'
- name: code-review
  kind: plugin
  summary: read-only PR-review *runner*
  source: claude-plugins-official
  pin: 'unpinned: installed from the source head'
  provenance: not reviewed
  used_by: optional pair for `meaningfy-code-review`
  opencode_status: unsupported (Claude plugin)
  claude_install: '`/plugin install code-review@claude-plugins-official`'
  opencode_install: '**gap (optional)** — no opencode plugin equivalent; on opencode run the `meaningfy-code-review`
    skill directly or opencode''s native review. The review *checklist* (the skill) works on both CLIs,
    so no workflow is blocked.'
