# External dependency register (rebundle-by-activity D-7): one entry per dependency the catalogue
# references but does not ship. `make skill-inventory` renders the tables in
# docs/environment/dual-cli/compatibility.md and mcp-setup.md; `make validate` checks the fields.
- name: superpowers
  kind: plugin
  summary: brainstorming, test-driven-development, systematic-debugging, verification-before-completion,
    requesting/receiving-code-review, dispatching-parallel-agents, subagent-driven-development
  source: obra/superpowers
  pin: 'unpinned: installed from the source head'
  provenance: not reviewed
  used_by: CLAUDE.md/AGENTS.md routing, epic-planning, guardrails, spec-stewardship
  opencode_status: native (own opencode plugin)
  claude_install: plugin marketplace
  opencode_install: 'ships its own opencode plugin — `{"plugin": ["superpowers@git+https://github.com/obra/superpowers.git"]}`
    in `opencode.json`. Not a `.claude/skills/` copy; see [superpowers'' own opencode install doc](https://github.com/obra/superpowers/blob/main/docs/README.opencode.md).'
