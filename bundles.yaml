# bundles.yaml — the one bundle definition (single-source-distribution DEC-2).
# After any membership change, or any agent-frontmatter change, run `make bundles`.
# Never edit .claude-plugin/marketplace.json, bundles/ or tools/opencode-catalogue.json by hand.
name: meaningfy-skillery
owner: {name: Meaningfy, email: info@meaningfy.ws}
description: Meaningfy company-wide skills, agents, methodologies, and engineering standards for working with LLM agents consistently
bundles:
  - name: meaningfy-core
    description: "Cross-cutting basics everyone installs: clear technical writing, explanatory-writing craft, the writing antipatterns catalogue, the Meaningfy company voice, the Meaningfy git/PR workflow, agentic guardrails, how to report a skill or agent problem to skillery, and your own rules for agents: load, learn and groom them (rulebook, rule-learner, rule-steward)"
    skills:
      - technical-writing
      - explanatory-writing
      - writing-antipatterns
      - meaningfy-voice
      - meaningfy-git-workflow
      - guardrails
      - skillery-feedback
      - rulebook
      - rule-learner
      - rule-steward
    agents: []
  - name: meaningfy-consulting
    description: "The advisory role: semantic-technologies coaching, the Decision Package, and executive communication"
    skills:
      - semantic-consulting-coach
      - decision-package
      - executive-communication
    agents: []
  - name: meaningfy-sales
    description: "The commercial role: proposal and offer writing, and estimation"
    skills:
      - proposal-writing
      - estimation
      - sales-pipeline-custody
      - sales-accounts
      - sales-qualification
      - sales-conversations
      - sales-operations
    agents: [proposal-writer, sales-agent]
    requires: [meaningfy-consulting]
  - name: meaningfy-architecture
    description: "The design / modelling role: system architecture (C4, ArchiMate/UML, ADRs, contracts), the living conceptual model, the shared modelling conventions, and the LinkML craft (LinkML → typed artefacts + OWL/SHACL)"
    skills:
      - architecture
      - conceptual-modelling
      - modelling-conventions
      - linkml-engineering
      - formal-reasoning
    agents: [system-architect, conceptual-modeller]
  - name: meaningfy-building
    description: "The delivery / developer role: the spine build loop (epic-planning, spec-stewardship, clarity-gate, BDD, code review), clean layered Python (cosmic-python), repo scaffolding (project-setup), CD/deploy (ci-cd-delivery), and the release lifecycle (meaningfy-release)"
    skills:
      - epic-planning
      - spec-stewardship
      - clarity-gate
      - bdd-gherkin
      - meaningfy-code-review
      - cosmic-python
      - project-setup
      - ci-cd-delivery
      - meaningfy-release
    agents: [epic-planner, implementer, code-reviewer]
    requires: [meaningfy-architecture]
  - name: meaningfy-devops
    description: "The operations role: provision and change servers as code (infrastructure-operations), run and deploy stacks (stack-operations), monitor, check daily, answer incidents and back up (service-reliability), and keep access and secrets safe (infrastructure-security); with an interactive devops agent, an unattended watch and an infrastructure reviewer"
    skills:
      - infrastructure-operations
      - stack-operations
      - service-reliability
      - infrastructure-security
    agents: [devops-engineer, ops-watch, infra-reviewer]
    requires: [meaningfy-consulting]
  - name: vault-assistant
    description: "The workflow bundle for people who keep a personal Obsidian vault: set it up (vault-setup), write notes one way (vault-conventions), run projects from charter to archive (vault-project, vault-resume, vault-capture), curate (vault-promote, vault-tidy), and keep a rhythm of plans and a morning note (vault-planning, vault-daily). Needs the external obsidian@obsidian-skills plugin and the company memory"
    skills:
      - vault-setup
      - vault-conventions
      - vault-project
      - vault-resume
      - vault-capture
      - vault-promote
      - vault-tidy
      - vault-planning
      - vault-daily
    agents: []
